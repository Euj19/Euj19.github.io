<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading... | Eujin Chae</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
          },
        }
      }
    }
  </script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <style>
    .article h1 { font-size: 1.875rem; font-weight: 700; margin: 0 0 0.75rem; }
    .article h2 { font-size: 1.5rem; font-weight: 600; margin: 1.75rem 0 0.75rem; }
    .article h3 { font-size: 1.25rem; font-weight: 600; margin: 1.5rem 0 0.5rem; }
    .article p { margin: 0 0 1rem; line-height: 1.8; }
    .article ul { list-style: disc; padding-left: 1.5rem; margin: 0 0 1rem; }
    .article ol { list-style: decimal; padding-left: 1.5rem; margin: 0 0 1rem; }
    .article li { margin-bottom: 0.5rem; line-height: 1.7; }
    .article a { color: #2563eb; text-decoration: underline; }
    .article blockquote { border-left: 4px solid #e5e5e5; padding-left: 1rem; margin: 1rem 0; color: #525252; font-style: italic; }
    .article code { background: #f5f5f5; padding: 0.15rem 0.35rem; border-radius: 0.25rem; font-size: 0.9em; }
    .article pre { background: #f5f5f5; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin: 1rem 0; }
  </style>
</head>
<body class="bg-white text-neutral-900 font-sans antialiased">
  <nav class="flex justify-between items-center px-6 py-8 max-w-4xl mx-auto">
    <div class="flex space-x-8">
      <a href="/" class="text-sm font-medium tracking-wide text-neutral-600 hover:text-neutral-900">home</a>
      <a href="/blog/" class="text-sm font-medium tracking-wide text-neutral-600 hover:text-neutral-900">blog</a>
      <a href="/projects.html" class="text-sm font-medium tracking-wide text-neutral-600 hover:text-neutral-900">projects</a>
    </div>
  </nav>

  <main class="max-w-2xl mx-auto px-6 py-8">
    <div id="loadingState" class="text-center py-12">
      <div class="animate-pulse">
        <div class="h-8 bg-neutral-200 rounded w-3/4 mx-auto mb-4"></div>
        <div class="h-4 bg-neutral-100 rounded w-1/4 mx-auto mb-8"></div>
        <div class="space-y-3">
          <div class="h-4 bg-neutral-100 rounded"></div>
          <div class="h-4 bg-neutral-100 rounded"></div>
          <div class="h-4 bg-neutral-100 rounded w-5/6"></div>
        </div>
      </div>
    </div>

    <div id="errorState" class="hidden text-center py-12">
      <div class="text-5xl mb-4">&#128533;</div>
      <h2 class="text-2xl font-bold mb-2">Post Not Found</h2>
      <p class="text-neutral-600 mb-6">The post you're looking for doesn't exist.</p>
      <a href="/blog/" class="inline-block bg-neutral-900 text-white py-2 px-6 rounded-lg font-medium hover:bg-neutral-800 transition">Back to Blog</a>
    </div>

    <article id="postContent" class="hidden">
      <header class="mb-8">
        <h1 id="postTitle" class="text-3xl font-bold tracking-tight mb-3"></h1>
        <div class="flex items-center gap-3 text-sm text-neutral-500">
          <span id="postAuthor"></span>
          <span>&bull;</span>
          <span id="postDate"></span>
        </div>
      </header>

      <div id="postBody" class="article"></div>

      <footer class="mt-12 pt-8 border-t border-neutral-100">
        <div class="flex justify-between items-center">
          <a href="/blog/" class="text-neutral-600 hover:text-neutral-900 transition">&larr; Back to all posts</a>
          <button onclick="deletePost()" class="text-sm text-red-500 hover:text-red-700 transition">
            Delete Post
          </button>
        </div>
      </footer>
    </article>
  </main>

  <script src="/firebase-config.js"></script>
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const postId = urlParams.get('id');

    function formatDate(timestamp) {
      if (!timestamp) return 'Just now';
      const date = timestamp.toDate();
      return date.toLocaleDateString('en-US', {
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });
    }

    async function loadPost() {
      if (!postId) {
        showError();
        return;
      }

      try {
        const doc = await postsCollection.doc(postId).get();

        if (!doc.exists) {
          showError();
          return;
        }

        const post = doc.data();
        document.title = post.title + ' | Eujin Chae';
        document.getElementById('postTitle').textContent = post.title;
        document.getElementById('postAuthor').textContent = post.author || 'Anonymous';
        document.getElementById('postDate').textContent = formatDate(post.createdAt);
        document.getElementById('postBody').innerHTML = post.content;

        document.getElementById('loadingState').classList.add('hidden');
        document.getElementById('postContent').classList.remove('hidden');

      } catch (error) {
        console.error('Error loading post:', error);
        showError();
      }
    }

    function showError() {
      document.getElementById('loadingState').classList.add('hidden');
      document.getElementById('errorState').classList.remove('hidden');
    }

    async function deletePost() {
      if (!postId) return;
      
      if (!confirm('Are you sure you want to delete this post? This action cannot be undone.')) {
        return;
      }

      try {
        await postsCollection.doc(postId).delete();
        alert('Post deleted successfully!');
        window.location.href = '/blog/';
      } catch (error) {
        console.error('Error deleting post:', error);
        alert('Failed to delete post. Please try again.');
      }
    }

    loadPost();
  </script>
</body>
</html>
