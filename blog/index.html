---
layout: default
title: Blog
---

<h1 class="text-2xl font-bold mb-6">Blog</h1>

<ul class="space-y-5">
  {% for post in site.posts %}
    <li>
      <a class="text-lg font-medium hover:underline" href="{{ post.url | relative_url }}">{{ post.title }}</a>
      <div class="text-sm text-black/70">{{ post.date | date: "%B %-d, %Y" }}</div>
      {% if post.description %}
        <p class="mt-1 text-black/80">{{ post.description }}</p>
      {% endif %}
    </li>
  {% endfor %}
</ul>
