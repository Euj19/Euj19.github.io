<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ page.title }}{% if site.title %} | {{ site.title }}{% endif %}</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
      /* Simple Markdown styling for blog posts */
      .article h1 { font-size: 1.875rem; font-weight: 700; margin: 0 0 0.75rem; }
      .article h2 { font-size: 1.25rem; font-weight: 600; margin: 1.5rem 0 0.5rem; }
      .article h3 { font-size: 1.125rem; font-weight: 600; margin: 1.25rem 0 0.5rem; }
      .article p { margin: 0 0 1rem; line-height: 1.7; }
      .article ul { list-style: disc; padding-left: 1.25rem; margin: 0 0 1rem; }
      .article ol { list-style: decimal; padding-left: 1.25rem; margin: 0 0 1rem; }
      .article a { text-decoration: underline; }
      .article code { background: rgba(0,0,0,0.06); padding: 0.1rem 0.25rem; border-radius: 0.25rem; }
      .article pre { background: rgba(0,0,0,0.06); padding: 0.75rem; border-radius: 0.5rem; overflow-x: auto; margin: 0 0 1rem; }
    </style>
  </head>

  <body class="bg-white text-black font-sans">
    <nav class="flex justify-between items-center p-6 max-w-4xl mx-auto">
      <div class="flex space-x-6">
        <a href="{{ '/' | relative_url }}" class="text-sm font-medium hover:underline">home</a>
        <a href="{{ '/blog/' | relative_url }}" class="text-sm font-medium hover:underline">blog</a>
        <a href="{{ '/projects.html' | relative_url }}" class="text-sm font-medium hover:underline">projects</a>
        <!-- Optional: show editor link -->
        <!-- <a href="{{ '/blog-editor.html' | relative_url }}" class="text-sm font-medium hover:underline">write</a> -->
      </div>
    </nav>

    <main class="max-w-2xl mx-auto p-6">
      {{ content }}
    </main>
  </body>
</html>
